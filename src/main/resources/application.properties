# Dados de acesso ao MySQL do XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/db_philance?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Faz o Spring criar/atualizar as tabelas no MySQL automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostra no console as consultas SQL que o Spring fizer por baixo dos panos
spring.jpa.show-sql=true


